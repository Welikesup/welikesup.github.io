<meta charset="UTF-8">

<title>Suivi des ventes</title>

<style>
body{
  font-family:'Inter',sans-serif;
  background:#0f0f0f;
  color:white;
  margin:0;
}

.header{
  background:#000;
  padding:20px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,0.6);
}

.header img{height:60px;}

.header h1{
  margin:10px 0 0 0;
  font-weight:600;
  font-size:22px;
  letter-spacing:1px;
  color:#ff7a00;
}

.container{
  margin-top:60px;
  text-align:center;
  padding:10px;
}

input{
  padding:8px;
  width:80px;
  border-radius:8px;
  border:none;
  margin:4px;
  text-align:center;
}

button{
  padding:10px 15px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  max-width:100%;
}

button.validate{background:white;color:black;}
button.cancel{background:#222;color:white;margin-left:8px;}
button.cancel:disabled{opacity:0.3;cursor:not-allowed;}
button.catchup{background:#444;color:#ffd700;margin-left:8px;}

.btn-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:0px;
  margin-top:10px;
}

.btn-row button{
  margin-top:0;
  flex:1 1 0;
  min-width:0;
  font-size:12px;
  padding:8px 6px;
}

.hidden{display:none;}

#welcome{
  text-align:center;
  margin-top:30px;
  font-weight:600;
}

#items{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  padding:30px;
}

.item{
  background:#ff7a00;
  padding:14px 18px 16px 18px;
  margin:15px;
  border-radius:18px;
  width:260px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  transition:0.2s;
}

.item:hover{transform:translateY(-6px);}

.item.glow{
  box-shadow:
    0 0 10px rgba(30,126,52,0.7),
    0 0 20px rgba(30,126,52,0.6),
    0 0 30px rgba(30,126,52,0.5);
}

@keyframes leaderFlash{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

.item.leader-flash{
  animation:leaderFlash 1s ease;
}

.item h3{
  margin:4px 0 8px 0;
  font-size:18px;
}

.item p{
  margin:0 0 8px 0;
}

.progress-container{
  background:rgba(255,255,255,0.3);
  border-radius:20px;
  height:20px;
  margin-top:10px;
  overflow:hidden;
  position:relative;
}

.progress-bar{
  height:100%;
  width:0%;
  transition:width 0.5s ease;
  position:absolute;
  top:0;
  left:0;
  border-radius:20px;
  background:white;
}

.progress-text{
  position:relative;
  z-index:1;
  text-align:center;
  width:100%;
  line-height:20px;
  font-size:12px;
  font-weight:600;
}

.personal-line{
  font-size:14px;
  margin-top:4px;
  margin-bottom:0;
  font-weight:700;
  white-space:nowrap;
  line-height:1.2;
}

.personal-line strong{
  font-size:16px;
}

.admin-panel,
.ranking-panel,
.store-panel{
  background:#1c1c1c;
  padding:20px;
  margin:30px;
  border-radius:15px;
}

.sector-block{
  background:#111;
  border-radius:12px;
  padding:16px;
  margin-bottom:20px;
}

.sector-block h2{
  margin:0 0 14px 0;
  font-size:16px;
  font-weight:700;
  color:#ff7a00;
  letter-spacing:1px;
}

.ranking-panel h3,
.store-panel h3{
  margin-top:0;
  margin-bottom:12px;
}

.ranking-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:8px 10px;
  border-radius:10px;
  margin-bottom:8px;
  background:rgba(255,255,255,0.06);
  font-size:14px;
}

.ranking-row.top1{background:rgba(255,215,0,0.16);}
.ranking-row.top2{background:rgba(192,192,192,0.14);}
.ranking-row.top3{background:rgba(205,127,50,0.16);}

.ranking-left{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.ranking-rank{
  font-weight:700;
  width:26px;
  text-align:center;
}

.ranking-name{
  font-weight:600;
}

.ranking-score{
  font-weight:700;
}

/* Suivi boutique compact en 2 colonnes */
.store-progress-list{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px 12px;
}

.store-progress-row{
  border-radius:12px;
  padding:10px 12px;
  box-shadow:0 8px 18px rgba(0,0,0,0.25);
  transition:0.2s;
}

.store-progress-row:hover{
  transform:translateY(-2px);
}

.store-progress-row.glow{
  box-shadow:
    0 0 10px rgba(30,126,52,0.7),
    0 0 20px rgba(30,126,52,0.6),
    0 8px 18px rgba(0,0,0,0.25);
}

.store-progress-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:6px;
}

.store-progress-title{
  font-size:13px;
  font-weight:700;
}

.store-progress-meta{
  font-size:11px;
  text-align:right;
  white-space:nowrap;
  font-weight:600;
}

.store-progress-container{
  background:rgba(255,255,255,0.3);
  border-radius:999px;
  height:14px;
  overflow:hidden;
  position:relative;
}

.store-progress-bar{
  height:100%;
  width:0%;
  transition:width 0.5s ease;
  border-radius:999px;
  background:white;
}

.store-progress-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:10px;
  font-weight:700;
  pointer-events:none;
}

/* Directeur : deux colonnes secteurs */
.director-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  padding:20px;
}

.director-sector{
  background:#1c1c1c;
  border-radius:15px;
  padding:20px;
}

.director-sector h2{
  margin:0 0 14px 0;
  font-size:16px;
  font-weight:700;
  color:#ff7a00;
  text-align:center;
}

.director-kpi-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.director-kpi-row{
  border-radius:10px;
  padding:8px 10px;
  background:#ff7a00;
}

.director-kpi-title{
  font-size:12px;
  font-weight:700;
  margin-bottom:4px;
}

.director-kpi-values{
  font-size:11px;
  opacity:0.9;
}

@media(max-width:768px){
  .item{width:90%;}
  button{font-size:18px;padding:14px;}
  .btn-row button{font-size:12px;padding:8px 6px;}
  .container{margin-top:40px;}
  .ranking-row{font-size:15px;}
  .store-progress-list{grid-template-columns:1fr;}
  .store-progress-head{flex-direction:column;align-items:flex-start;}
  .store-progress-meta{text-align:left;white-space:normal;}
  .director-grid{grid-template-columns:1fr;}
  .director-kpi-grid{grid-template-columns:1fr;}
  #directorSummary{grid-template-columns:repeat(2,1fr) !important;}
  #globalSummaryContent{grid-template-columns:repeat(2,1fr) !important;}
}

/* =====================================================================
   HASH
   ===================================================================== */
async function hashPassword(password){
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2,"0")).join("");
}

/* =====================================================================
   COMPUTE SECTOR TOTALS FROM PERSONAL
   ===================================================================== */
function computeSectorTotals(personal){
  const totals = buildEmptySectorTotals();
  Object.keys(sectors).forEach(sk => {
    itemsList.forEach(item => {
      let t = 0;
      sectors[sk].stores.forEach(store => t += personal?.[store]?.[item] || 0);
      totals[sk][item] = t;
    });
  });
  return totals;
}

function computeWeeklySectorTotals(weeklyPersonal){
  const totals = buildEmptyWeeklySectorTotals();
  Object.keys(sectors).forEach(sk => {
    itemsList.forEach(item => {
      let t = 0;
      sectors[sk].stores.forEach(store => t += weeklyPersonal?.[store]?.[item] || 0);
      totals[sk][item] = t;
    });
  });
  return totals;
}

/* =====================================================================
   ENSURE DATA STRUCTURE
   ===================================================================== */
async function ensureDataStructure(){
  await runTransaction(db, async (transaction) => {
    const snap = await transaction.get(ref);

    if(!snap.exists()){
      const data = {
        personal:            buildEmptyPersonal(),
        weeklyPersonal:      buildEmptyWeeklyPersonal(),
        sectorTotals:        buildEmptySectorTotals(),
        weeklySectorTotals:  buildEmptyWeeklySectorTotals(),
        boutiqueObjectives:  buildEmptyManagerStoreMap(),
        boutiqueInitial:     buildEmptyManagerStoreMap(),
        boutiqueProgress:    buildEmptyManagerStoreMap(),
        dailyObjective:      buildEmptyDailyObjective(),
        accessoirePersonal:  buildEmptyAccessoirePersonal(),
        accessoireWeekly:    buildEmptyAccessoireWeekly(),
        accessoireObjective: buildEmptyAccessoireObjective(),
        cercleStock:         buildEmptyCercleStock(),
        lastPersonalReset:   getToday()
      };
      transaction.set(ref, data);
      return;
    }

    const data = snap.data();
    let patch = {};
    let needsPatch = false;

    /* personal */
    const safePersonal = data.personal || {};
    let patchedPersonal = null;
    let personalChanged = false;
    allUsers.forEach(u => {
      if(!safePersonal[u]){
        if(!patchedPersonal) patchedPersonal = structuredClone(safePersonal);
        patchedPersonal[u] = {};
        itemsList.forEach(i => patchedPersonal[u][i] = 0);
        personalChanged = true;
        return;
      }
      itemsList.forEach(i => {
        if(typeof safePersonal[u][i] !== "number"){
          if(!patchedPersonal) patchedPersonal = structuredClone(safePersonal);
          if(!patchedPersonal[u]) patchedPersonal[u] = {};
          patchedPersonal[u][i] = 0;
          personalChanged = true;
        }
      });
    });
    if(personalChanged){ patch.personal = patchedPersonal; needsPatch = true; }

    /* weeklyPersonal */
    const safeWeekly = data.weeklyPersonal || {};
    let patchedWeekly = null;
    let weeklyChanged = false;
    allUsers.forEach(u => {
      if(!safeWeekly[u]){
        if(!patchedWeekly) patchedWeekly = structuredClone(safeWeekly);
        patchedWeekly[u] = {};
        itemsList.forEach(i => patchedWeekly[u][i] = 0);
        weeklyChanged = true;
        return;
      }
      itemsList.forEach(i => {
        if(typeof safeWeekly[u][i] !== "number"){
          if(!patchedWeekly) patchedWeekly = structuredClone(safeWeekly);
          if(!patchedWeekly[u]) patchedWeekly[u] = {};
          patchedWeekly[u][i] = 0;
          weeklyChanged = true;
        }
      });
    });
    if(weeklyChanged){ patch.weeklyPersonal = patchedWeekly; needsPatch = true; }

    /* sectorTotals */
    const safeST = data.sectorTotals || {};
    let patchedST = structuredClone(safeST);
    let stChanged = false;
    Object.keys(sectors).forEach(sk => {
      if(!patchedST[sk]){ patchedST[sk] = {}; stChanged = true; }
      itemsList.forEach(i => {
        if(typeof patchedST[sk][i] !== "number"){ patchedST[sk][i] = 0; stChanged = true; }
      });
    });
    if(stChanged){ patch.sectorTotals = patchedST; needsPatch = true; }

    /* weeklySectorTotals */
    const safeWST = data.weeklySectorTotals || {};
    let patchedWST = structuredClone(safeWST);
    let wstChanged = false;
    Object.keys(sectors).forEach(sk => {
      if(!patchedWST[sk]){ patchedWST[sk] = {}; wstChanged = true; }
      itemsList.forEach(i => {
        if(typeof patchedWST[sk][i] !== "number"){ patchedWST[sk][i] = 0; wstChanged = true; }
      });
    });
    if(wstChanged){ patch.weeklySectorTotals = patchedWST; needsPatch = true; }

    /* boutiqueObjectives / Initial / Progress */
    const safeBO = data.boutiqueObjectives || {};
    const safeBI = data.boutiqueInitial    || {};
    const safeBP = data.boutiqueProgress   || {};
    let pBO = structuredClone(safeBO);
    let pBI = structuredClone(safeBI);
    let pBP = structuredClone(safeBP);
    let bChanged = false;
    allStoreUsers.forEach(store => {
      if(!pBO[store]){ pBO[store] = {}; bChanged = true; }
      if(!pBI[store]){ pBI[store] = {}; bChanged = true; }
      if(!pBP[store]){ pBP[store] = {}; bChanged = true; }
      managerItemsList.forEach(i => {
        if(typeof pBO[store][i] !== "number"){ pBO[store][i] = 0; bChanged = true; }
        if(typeof pBI[store][i] !== "number"){ pBI[store][i] = 0; bChanged = true; }
        if(typeof pBP[store][i] !== "number"){ pBP[store][i] = 0; bChanged = true; }
      });
    });
    if(bChanged){
      patch.boutiqueObjectives = pBO;
      patch.boutiqueInitial    = pBI;
      patch.boutiqueProgress   = pBP;
      needsPatch = true;
    }

    /* dailyObjective */
    const safeDO = data.dailyObjective || {};
    let pDO = { ...safeDO };
    let doChanged = false;
    allStoreUsers.forEach(store => {
      if(typeof pDO[store] !== "number"){ pDO[store] = 0; doChanged = true; }
    });
    if(doChanged){ patch.dailyObjective = pDO; needsPatch = true; }

    if(typeof data.lastPersonalReset !== "string"){
      patch.lastPersonalReset = getToday();
      needsPatch = true;
    }

    /* accessoire */
    const safeAP = data.accessoirePersonal || {};
    const safeAW = data.accessoireWeekly   || {};
    const safeAO = data.accessoireObjective || { sector:{secteur1:0,secteur2:0}, store:{} };
    let pAP = { ...safeAP }, pAW = { ...safeAW };
    let aChanged = false;
    allStoreUsers.forEach(store => {
      if(typeof pAP[store] !== "number"){ pAP[store] = 0; aChanged = true; }
      if(typeof pAW[store] !== "number"){ pAW[store] = 0; aChanged = true; }
    });
    if(aChanged){
      patch.accessoirePersonal = pAP;
      patch.accessoireWeekly   = pAW;
      needsPatch = true;
    }

    /* cercleStock */
    const safeCS = data.cercleStock || {};
    let pCS = structuredClone(safeCS);
    let csChanged = false;
    allStoreUsers.forEach(store => {
      if(!pCS[store]){ pCS[store] = {}; csChanged = true; }
      cercleTypes.forEach(t => {
        if(!pCS[store][t] || typeof pCS[store][t].initial !== "number"){
          pCS[store][t] = { initial: 0, restant: 0 };
          csChanged = true;
        }
      });
    });
    if(csChanged){ patch.cercleStock = pCS; needsPatch = true; }

    if(needsPatch) transaction.set(ref, patch, { merge:true });
  });
}

/* =====================================================================
   RESET DAILY PERSONAL
   ===================================================================== */
async function resetDailyPersonalIfNeeded(){
  const today = getToday();
  await runTransaction(db, async (transaction) => {
    const snap = await transaction.get(ref);
    if(!snap.exists()) return;
    const data = snap.data();
    if(data.lastPersonalReset === today) return;
    transaction.set(ref, {
      personal: buildEmptyPersonal(),
      accessoirePersonal: buildEmptyAccessoirePersonal(),
      lastPersonalReset: today
    }, { merge:true });
  });
}

window.login = async function(){
  const pass = document.getElementById("password").value;
  if(!window.crypto || !window.crypto.subtle){
    alert("Navigateur non compatible. Utilisez Chrome ou Safari récent.");
    return;
  }
  try{
    const hashed = await hashPassword(pass);
    const account = accounts[hashed];
    if(!account){
      document.getElementById("error").innerText = "Mot de passe incorrect";
      return;
    }
    currentUser   = account.name;
    currentRole   = account.role;
    currentSector = account.sector;
    currentStore  = account.store;

    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("welcome").innerText = "Bienvenue " + currentUser;

    if(isAdmin() || isManager()){
      document.getElementById("adminPanel").classList.remove("hidden");
      document.getElementById("rankingPanel").classList.remove("hidden");
    }

    if(isAdmin()){
      document.getElementById("adminKpiButtons").style.display = "block";
    }

    if(isStore() && sectors["secteur2"].stores.includes(currentUser)){
      document.getElementById("rankingPanel").classList.remove("hidden");
    }

    if(isAdmin()){
      document.getElementById("globalSummaryPanel").classList.remove("hidden");
    }

    if(isStore() || isManager()){
      document.getElementById("txPanel").classList.remove("hidden");
      document.getElementById("storeTrackingPanel").classList.remove("hidden");
    }

    if(isDirector()){
      document.getElementById("directorPanel").classList.remove("hidden");
    }

    await initData();
  }catch(e){
    console.error(e);
    alert("Erreur lors de la connexion.");
  }
};

/* =====================================================================
   INIT DATA
   ===================================================================== */
async function initData(){
  await ensureDataStructure();
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }

  let adminRendered = false;
  unsubscribeSnapshot = onSnapshot(ref, (docSnap) => {
    globalData = docSnap.data() || {};

    if(isDirector()){
      renderDirector();
      renderCercle();
    } else {
      display();
      renderAccessoireTile();
      if(isAdmin() || isManager()){
        if(!adminRendered){ renderAdmin(); adminRendered = true; }
        renderRanking();
      }
      if(isStore() && sectors["secteur2"].stores.includes(currentUser)){
        renderRanking();
      }
      if(isAdmin()){ renderGlobalSummary(); }
      if(isStore() || isManager()){ renderStoreTracking(); renderTx(); }
      renderCercle();
    }
  });

  await resetDailyPersonalIfNeeded();
}

/* =====================================================================
   RENDER RANKING (admin secteur + manager)
   ===================================================================== */
function renderRanking(){
  const rankingContent = document.getElementById("rankingContent");
  if(!rankingContent) return;

  const sectorStores = getCurrentSectorStores();

  const rankingData = sectorStores.map(name => {
    let total = 0;
    itemsList.forEach(item => total += globalData.personal?.[name]?.[item] || 0);
    return { name, total };
  });

  rankingData.sort((a,b) => b.total !== a.total ? b.total - a.total : a.name.localeCompare(b.name,"fr"));

  const hasSales = rankingData.some(r => r.total > 0);
  if(!hasSales){
    rankingContent.innerHTML = `<div style="opacity:0.8;">Aucune vente aujourd'hui</div>`;
    return;
  }

  rankingContent.innerHTML = rankingData.map((row,index) => {
    let extraClass = "", medal = "";
    if(index === 0){ extraClass = "top1"; medal = "🥇"; }
    else if(index === 1){ extraClass = "top2"; medal = "🥈"; }
    else if(index === 2){ extraClass = "top3"; medal = "🥉"; }
    return `
      <div class="ranking-row ${extraClass}">
        <div class="ranking-left">
          <div class="ranking-rank">${medal || (index+1)}</div>
          <div class="ranking-name">${row.name}</div>
        </div>
        <div class="ranking-score">${row.total}</div>
      </div>`;
  }).join("");
}

/* =====================================================================
   DISPLAY TUILES KPI
   ===================================================================== */
function display(){
  const container = document.getElementById("items");
  container.innerHTML = "";
  const nextLeaderKeys = {};
  const sectorStores = getCurrentSectorStores();

  itemsList.forEach(item => {
    const hasObjective = !itemsWithoutObjective.includes(item);

    /* Totaux secteur */
    const sectorTotal   = globalData.sectorTotals?.[currentSector]?.[item] || 0;
    const weeklySector  = globalData.weeklySectorTotals?.[currentSector]?.[item] || 0;

    /* Objectif secteur (admin uniquement — stocké dans sectorTotals initial) */
    const initial       = globalData.boutiqueObjectives?.[currentStore]?.["__sectorInitial__"] || 0;

    /* Totaux du jour pour ce secteur */
    let todaySectorValue = 0;
    sectorStores.forEach(name => todaySectorValue += globalData.personal?.[name]?.[item] || 0);

    /* Valeurs boutique courante */
    const storeTodayValue = currentStore ? (globalData.personal?.[currentStore]?.[item] || 0) : 0;
    const storeWeekValue  = currentStore ? (globalData.weeklyPersonal?.[currentStore]?.[item] || 0) : 0;

    /* Objectif secteur = sectorTotals initial (géré par admin via un champ dédié) */
    const sectorInitial  = globalData.sectorInitial?.[currentSector]?.[item] || 0;
    const diff           = sectorInitial - weeklySector;
    const percentBar     = Math.min(sectorInitial > 0 ? (weeklySector / sectorInitial) * 100 : 0, 100);
    const percentText    = sectorInitial > 0 ? (weeklySector / sectorInitial) * 100 : 0;

    const isRRStore = isStore() && sectors["secteur2"].stores.includes(currentUser);
    const storeTodayRR  = globalData.personal?.[currentUser]?.[item] || 0;
    const storeWeeklyRR = globalData.weeklyPersonal?.[currentUser]?.[item] || 0;

    let percentColor = "#ff7a00";
    if(percentText >= 100 && percentText < 120) percentColor = "#66cc88";
    if(percentText >= 120) percentColor = "#1e7e34";

    /* Leader parmi les boutiques du secteur */
    let leaderValue = 0, leaders = [];
    sectorStores.forEach(name => {
      const val = globalData.personal?.[name]?.[item] || 0;
      if(val > leaderValue){ leaderValue = val; leaders = [name]; }
      else if(val === leaderValue && val > 0){ leaders.push(name); }
    });
    const leaderKey = leaderValue > 0 ? `${leaders.join("|")}::${leaderValue}` : "";
    nextLeaderKeys[item] = leaderKey;

    let leaderHTML = "";
    if(hasTileOverview() && leaderValue > 0){
      const leaderNames = leaders.join(" / ");
      leaderHTML = `<div style="font-size:13px;margin-top:6px;font-weight:700;color:#FFD700;
        text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;">
        🏆 Boutique leader : ${leaderNames} (${leaderValue})</div>`;
    }

    /* Détail par boutique (admin + manager) */
    let detailHTML = "";
    if(hasTileOverview()){
      sectorStores.forEach(name => {
        if(currentStore && name === currentStore) return;
        const val = globalData.personal?.[name]?.[item] || 0;
        detailHTML += `<div style="font-size:12px;margin-top:2px;line-height:1.15;">${name} : ${val}</div>`;
      });
    }

    const cancelAllowed = isManager() ? true : !!(cancelTimers[item] && Date.now() < cancelTimers[item]);
    const canSell = !isDirector();

    const div = document.createElement("div");
    div.className = "item";

    if(hasObjective){
      if(percentText >= 120){ div.style.background = "#1e7e34"; div.classList.add("glow"); }
      else if(percentText >= 100){ div.style.background = "#66cc88"; }
      else { div.style.background = "#ff7a00"; }
    } else {
      div.style.background = "#ff7a00";
    }

    if(hasTileOverview() && leaderValue > 0 &&
       previousLeaderKeys[item] !== undefined && previousLeaderKeys[item] !== leaderKey){
      div.classList.add("leader-flash");
    }

    const objectifText = sectorInitial > 0
      ? (diff >= 0 ? `Objectif restant : <strong>${diff}</strong>` : `Objectif dépassé de : <strong>${-diff}</strong>`)
      : "";

    const objectiveBlock = hasObjective && sectorInitial > 0 ? `
      <p>${objectifText}</p>
      ${(isManager() || isRRStore) ? `
        <div class="personal-line">Secteur semaine : <strong>${weeklySector}</strong></div>
        <div class="personal-line">Secteur aujourd'hui : <strong>${todaySectorValue}</strong></div>
      ` : ``}
      <div class="progress-container">
        <div class="progress-bar" style="width:${percentBar}%"></div>
        <div class="progress-text" style="color:${percentColor}">${percentText.toFixed(0)}%</div>
      </div>
    ` : (hasObjective && (isManager() || isRRStore) ? `
      <div class="personal-line">Secteur semaine : <strong>${weeklySector}</strong></div>
      <div class="personal-line">Secteur aujourd'hui : <strong>${todaySectorValue}</strong></div>
    ` : ``);

    let extraManagerLines = "";
    if(isManager()){
      extraManagerLines = `
        <div class="personal-line">Boutique semaine : <strong>${storeWeekValue}</strong></div>
        <div class="personal-line">Boutique aujourd'hui : <strong>${storeTodayValue}</strong></div>
      `;
    } else if(isRRStore){
      extraManagerLines = `
        <div class="personal-line">Boutique semaine : <strong>${storeWeeklyRR}</strong></div>
        <div class="personal-line">Boutique aujourd'hui : <strong>${storeTodayRR}</strong></div>
      `;
    }

    let buttonsHTML = "";
    if(canSell){
      if(isManager()){
        buttonsHTML = `
          <div class="btn-row">
            <button class="validate" onclick="decrement('${item}')">Valider</button>
            <button class="cancel" ${!cancelAllowed?"disabled":""} onclick="cancelSale('${item}')">Annuler</button>
            <button class="catchup" onclick="catchUpSale('${item}')">Rattraper</button>
          </div>`;
      } else if(isAdmin()){
        buttonsHTML = `
          <div class="btn-row">
            <button class="validate" onclick="adminDecrement('${item}')">Valider</button>
            <button class="cancel" onclick="adminCancel('${item}')">Annuler</button>
            <button class="catchup" onclick="adminCatchUp('${item}')">Rattraper</button>
          </div>`;
      } else {
        buttonsHTML = `
          <button class="validate" onclick="decrement('${item}')">Valider une vente</button>
          <button class="cancel" ${!cancelAllowed?"disabled":""} onclick="cancelSale('${item}')">Annuler</button>`;
      }
    }

    div.innerHTML = `
      <h3>${item}</h3>
      ${objectiveBlock}
      ${(isManager() || isRRStore) ? extraManagerLines : `
        <div class="personal-line">${hasTileOverview() ? "Ventes du secteur semaine" : "Ventes de la boutique semaine"} : <strong>${hasTileOverview() ? weeklySector : (globalData.weeklyPersonal?.[currentUser]?.[item]||0)}</strong></div>
        <div class="personal-line">${hasTileOverview() ? "Ventes du secteur aujourd'hui" : "Ventes de la boutique aujourd'hui"} : <strong>${hasTileOverview() ? todaySectorValue : (globalData.personal?.[currentUser]?.[item]||0)}</strong></div>
      `}
      ${detailHTML}
      ${leaderHTML}
      ${buttonsHTML}
    `;

    container.appendChild(div);
  });

  previousLeaderKeys = nextLeaderKeys;
}

function renderStoreTracking(){
  const panel   = document.getElementById("storeTrackingPanel");
  const title   = document.getElementById("storeTrackingTitle");
  const content = document.getElementById("storeTrackingContent");
  if(!panel || !title || !content || !currentStore) return;
  panel.classList.remove("hidden");
  title.textContent = `Suivi boutique — ${currentStore}`;

  const storeObjectives = globalData.boutiqueObjectives?.[currentStore] || {};
  const storeInitial    = globalData.boutiqueInitial?.[currentStore]    || {};
  const storeProgress   = globalData.boutiqueProgress?.[currentStore]   || {};

  content.innerHTML = boutiqueDisplayList.map(item => {
    const initial   = storeInitial[item] ?? 0;
    const progress  = storeProgress[item] ?? 0;
    const diff      = initial - progress;
    const percentText = initial > 0 ? (progress / initial) * 100 : 0;
    const percentBar  = Math.min(percentText, 100);

    let bgColor = "#ff7a00", textColor = "#ff7a00", extraClass = "";
    if(percentText >= 120){ bgColor = "#1e7e34"; textColor = "#1e7e34"; extraClass = "glow"; }
    else if(percentText >= 100){ bgColor = "#66cc88"; textColor = "#66cc88"; }

    const metaText = initial > 0
      ? (diff >= 0 ? `Reste : ${diff} • ${progress}/${initial}` : `Dépassé : ${-diff} • ${progress}/${initial}`)
      : `Aucun objectif • ${progress}`;

    return `
      <div class="store-progress-row ${extraClass}" style="background:${bgColor};">
        <div class="store-progress-head">
          <div class="store-progress-title">${item}</div>
          <div class="store-progress-meta">${metaText}</div>
        </div>
        <div class="store-progress-container">
          <div class="store-progress-bar" style="width:${percentBar}%;"></div>
          <div class="store-progress-text" style="color:${textColor};">${initial > 0 ? percentText.toFixed(0)+"%" : "0%"}</div>
        </div>
      </div>`;
  }).join("");
}

  const metaText = objective > 0
    ? (diff >= 0 ? `Reste : ${diff} • ${todayTotal}/${objective}` : `Dépassé de : ${-diff} • ${todayTotal}/${objective}`)
    : `Aucun objectif • ${todayTotal} placement${todayTotal>1?"s":""} aujourd'hui`;

    <div class="store-progress-row ${glowClass}" style="background:${bgColor};">
      <div class="store-progress-head">
        <div class="store-progress-title" style="font-size:15px;">🎯 Taux de Transformation</div>

function renderDirector(){
  renderDirectorSummary();
  Object.keys(sectors).forEach((sk, idx) => {
    const num = idx + 1;
    const sectorStores = sectors[sk].stores;

    /* Classement */
    const rankingData = sectorStores.map(name => {
      let total = 0;
      itemsList.forEach(item => total += globalData.personal?.[name]?.[item] || 0);
      return { name, total };
    }).sort((a,b) => b.total - a.total);

    const hasSales = rankingData.some(r => r.total > 0);
    const rankingEl = document.getElementById(`directorRanking${num}`);
    if(rankingEl){
      if(!hasSales){
        rankingEl.innerHTML = `<div style="opacity:0.6;font-size:13px;">Aucune vente aujourd'hui</div>`;
      } else {
        rankingEl.innerHTML = rankingData.map((row, index) => {
          let extraClass = "", medal = "";
          if(index === 0){ extraClass = "top1"; medal = "🥇"; }
          else if(index === 1){ extraClass = "top2"; medal = "🥈"; }
          else if(index === 2){ extraClass = "top3"; medal = "🥉"; }
          return `
            <div class="ranking-row ${extraClass}">
              <div class="ranking-left">
                <div class="ranking-rank">${medal || (index+1)}</div>
                <div class="ranking-name">${row.name}</div>
              </div>
              <div class="ranking-score">${row.total}</div>
            </div>`;
        }).join("");
      }
    }

    /* KPI avec détail par boutique */
    const kpiEl = document.getElementById(`directorKpi${num}`);
    if(kpiEl){
      kpiEl.innerHTML = boutiqueDisplayList.map(item => {
        let todayTotal = 0, weeklyTotal = 0;
        sectorStores.forEach(name => {
          todayTotal  += globalData.personal?.[name]?.[item]       || 0;
          weeklyTotal += globalData.weeklyPersonal?.[name]?.[item] || 0;
        });

        const sectorInitial = globalData.sectorInitial?.[sk]?.[item] || 0;
        const percentText   = sectorInitial > 0 ? (weeklyTotal / sectorInitial) * 100 : 0;
        const percentBar    = Math.min(percentText, 100);

        let bgColor = "#ff7a00", textColor = "#ff7a00", extraClass = "";
        if(percentText >= 120){ bgColor = "#1e7e34"; textColor = "#1e7e34"; extraClass = "glow"; }
        else if(percentText >= 100){ bgColor = "#66cc88"; textColor = "#66cc88"; }

        const detailHTML = sectorStores.map(name => {
          const val = globalData.personal?.[name]?.[item] || 0;
          return `<div style="font-size:11px;margin-top:2px;line-height:1.3;">${name} : <strong>${val}</strong></div>`;
        }).join("");

        /* Leader */
        let leaderValue = 0, leaders = [];
        sectorStores.forEach(name => {
          const val = globalData.personal?.[name]?.[item] || 0;
          if(val > leaderValue){ leaderValue = val; leaders = [name]; }
          else if(val === leaderValue && val > 0){ leaders.push(name); }
        });
        const leaderHTML = leaderValue > 0 ? `
          <div style="font-size:11px;margin-top:6px;font-weight:700;color:#FFD700;
            text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;">
            🏆 ${leaders.join(" / ")} (${leaderValue})
          </div>` : "";

        const objectifText = sectorInitial > 0
          ? (weeklyTotal <= sectorInitial
            ? `Reste : ${sectorInitial - weeklyTotal}`
            : `Dépassé : +${weeklyTotal - sectorInitial}`)
          : "";

        return `
          <div class="director-kpi-row ${extraClass}" style="background:${bgColor};">
            <div class="director-kpi-title" style="font-size:13px;margin-bottom:6px;">${item}</div>
            ${detailHTML}
            ${leaderHTML}
            <div style="margin-top:6px;font-size:12px;font-weight:700;">
              Aujourd'hui : ${todayTotal} &nbsp;•&nbsp; Semaine : ${weeklyTotal}${sectorInitial > 0 ? `/${sectorInitial}` : ""}
            </div>
            ${sectorInitial > 0 ? `
            <div style="font-size:11px;opacity:0.85;margin-bottom:4px;">${objectifText}</div>
            <div class="store-progress-container" style="margin-top:4px;">
              <div class="store-progress-bar" style="width:${percentBar}%;"></div>
              <div class="store-progress-text" style="color:${textColor};">${percentText.toFixed(0)}%</div>
            </div>` : ""}
          </div>`;
      }).join("");
    }

    /* Accessoire secteur */
    const accEl = document.getElementById(`directorAcc${num}`);
    if(accEl){
      let accWeekly = 0, accToday = 0;
      const accObjSector = globalData.accessoireObjective?.sector?.[sk] || 0;
      sectorStores.forEach(s => {
        accWeekly += globalData.accessoireWeekly?.[s]   || 0;
        accToday  += globalData.accessoirePersonal?.[s] || 0;
      });
      const fmt = v => v.toLocaleString("fr-FR", { minimumFractionDigits:2, maximumFractionDigits:2 }) + " €";
      const accPct     = accObjSector > 0 ? Math.min((accWeekly / accObjSector) * 100, 100) : 0;
      const accPctFull = accObjSector > 0 ? (accWeekly / accObjSector) * 100 : 0;
      let accBg = "#ff7a00", accTextColor = "#ff7a00", accGlow = "";
      if(accPctFull >= 120){ accBg = "#1e7e34"; accTextColor = "#1e7e34"; accGlow = "glow"; }
      else if(accPctFull >= 100){ accBg = "#66cc88"; accTextColor = "#66cc88"; }
      const detailAcc = sectorStores.map(s => {
        const v = globalData.accessoirePersonal?.[s] || 0;
        return `<div style="font-size:11px;margin-top:2px;line-height:1.3;">${s} : <strong>${fmt(v)}</strong></div>`;
      }).join("");
      accEl.innerHTML = `
        <div class="director-kpi-row ${accGlow}" style="background:${accBg};grid-column:span 2;">
          <div class="director-kpi-title" style="font-size:13px;margin-bottom:6px;">Accessoire</div>
          ${detailAcc}
          <div style="margin-top:6px;font-size:12px;font-weight:700;">
            Aujourd'hui : ${fmt(accToday)} &nbsp;•&nbsp; Semaine : ${fmt(accWeekly)}${accObjSector > 0 ? ` / ${fmt(accObjSector)}` : ""}
          </div>
          ${accObjSector > 0 ? `
          <div class="store-progress-container" style="margin-top:4px;">
            <div class="store-progress-bar" style="width:${accPct}%;"></div>
            <div class="store-progress-text" style="color:${accTextColor};">${accPctFull.toFixed(0)}%</div>
          </div>` : ""}
        </div>`;
    }
  });
}

  if(cancelTimerTimeouts[item]) clearTimeout(cancelTimerTimeouts[item]);
  cancelTimerTimeouts[item] = setTimeout(() => {
    cancelTimers[item] = null;
    display();
  }, 20000);

  await runTransaction(db, async (transaction) => {
    const snap = await transaction.get(ref);
    if(!snap.exists()) return;
    const data = snap.data();

    const targetSector = currentSector;

      },

let _modalCallback = null;

function showStoreModal(title, stores, withQty, qtyLabel, callback){

  document.getElementById("storeModalTitle").textContent = title;

  const list = document.getElementById("storeModalList");
  list.innerHTML = stores.map(s => `
    <label style="display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;font-size:14px;color:white;">

        style="width:18px;height:18px;accent-color:#ff7a00;">
      ${s}
    </label>`).join("");

  /* Présélectionner le premier */
  const first = list.querySelector("input[type=radio]");
  if(first) first.checked = true;

  const qtyBlock = document.getElementById("storeModalQtyBlock");
  if(withQty){
    qtyBlock.style.display = "block";
    qtyBlock.querySelector("label").textContent = qtyLabel || "Quantité :";
    document.getElementById("storeModalQty").value = withQty === "money" ? "0" : "1";
    document.getElementById("storeModalQty").step = withQty === "money" ? "0.01" : "1";
  } else {
    qtyBlock.style.display = "none";
  }

  const modal = document.getElementById("storeModal");
  modal.style.display = "flex";
}

window.storeModalConfirm = function(){
  const selected = document.querySelector("input[name=storeModalRadio]:checked");
  if(!selected){ alert("Sélectionne une boutique."); return; }
  const store = selected.value;
  const qtyBlock = document.getElementById("storeModalQtyBlock");
  let qty = null;
  if(qtyBlock.style.display !== "none"){
    qty = parseFloat(document.getElementById("storeModalQty").value.replace(",","."));
    if(isNaN(qty) || qty <= 0){ alert("Valeur invalide."); return; }
  }
  storeModalClose();
  if(_modalCallback) _modalCallback(store, qty);
};

function renderAccessoireTile(){
  if(isDirector()) return;

  /* Supprimer l'ancienne tuile accessoire si elle existe */
  const existing = document.getElementById("accessoireTile");
  if(existing) existing.remove();

  const container = document.getElementById("items");
  if(!container) return;

  const sectorStores = isDirector() ? allStoreUsers : getCurrentSectorStores();

  /* Totaux jour et semaine */
  let todayTotal = 0, weeklyTotal = 0;
  let boutiqueTodayTotal = 0, boutiqueWeeklyTotal = 0;

  if(isStore()){
    todayTotal  = globalData.accessoirePersonal?.[currentUser] || 0;
    weeklyTotal = globalData.accessoireWeekly?.[currentUser]   || 0;
  } else if(isManager()){
    /* Totaux boutique */
    boutiqueTodayTotal  = globalData.accessoirePersonal?.[currentStore] || 0;
    boutiqueWeeklyTotal = globalData.accessoireWeekly?.[currentStore]   || 0;
    /* Totaux secteur = somme toutes boutiques */
    getCurrentSectorStores().forEach(s => {
      todayTotal  += globalData.accessoirePersonal?.[s] || 0;
      weeklyTotal += globalData.accessoireWeekly?.[s]   || 0;
    });
  } else {
    const stores = isDirector() ? allStoreUsers : getCurrentSectorStores();
    stores.forEach(s => {
      todayTotal  += globalData.accessoirePersonal?.[s] || 0;
      weeklyTotal += globalData.accessoireWeekly?.[s]   || 0;
    });
  }

  /* Objectif */
  let objective = 0;
  if(isAdmin()){
    objective = globalData.accessoireObjective?.sector?.[currentSector] || 0;
  } else if(isManager()){
    objective = globalData.accessoireObjective?.store?.[currentStore] || 0;
  } else if(isDirector()){
    Object.keys(sectors).forEach(sk => {
      objective += globalData.accessoireObjective?.sector?.[sk] || 0;
    });
  } else {
    objective = globalData.accessoireObjective?.store?.[currentUser] || 0;
  }

  const percentText = objective > 0 ? (weeklyTotal / objective) * 100 : 0;
  const percentBar  = Math.min(percentText, 100);

  let bgColor = "#ff7a00", glowClass = "", percentColor = "#ff7a00";
  if(percentText >= 120){ bgColor = "#1e7e34"; glowClass = "glow"; percentColor = "#1e7e34"; }
  else if(percentText >= 100){ bgColor = "#66cc88"; percentColor = "#66cc88"; }

  const fmt = v => v.toLocaleString("fr-FR", { minimumFractionDigits:2, maximumFractionDigits:2 }) + " €";

  const diffText = objective > 0
    ? (weeklyTotal <= objective
      ? `Objectif restant : <strong>${fmt(objective - weeklyTotal)}</strong>`
      : `Objectif dépassé de : <strong>${fmt(weeklyTotal - objective)}</strong>`)
    : "";

  /* Détail par boutique pour admin/manager/director/RR stores */
  let detailHTML = "";
  const isRRStoreAcc = isStore() && sectors["secteur2"].stores.includes(currentUser);
  if(isAdmin() || isManager() || isDirector() || isRRStoreAcc){
    const stores = isDirector() ? allStoreUsers : getCurrentSectorStores();
    stores.forEach(s => {
      if((isManager() && s === currentStore) || (isRRStoreAcc && s === currentUser)) return;
      const v = globalData.accessoirePersonal?.[s] || 0;
      detailHTML += `<div style="font-size:12px;margin-top:2px;line-height:1.15;">${s} : ${fmt(v)}</div>`;
    });
  }

  /* Boutons */
  let buttonsHTML = "";
  if(isManager()){
    buttonsHTML = `
      <div class="btn-row">
        <button class="validate" onclick="validateAccessoire()">Valider</button>
        <button class="cancel" onclick="cancelAccessoire()">Annuler</button>
        <button class="catchup" onclick="catchUpAccessoire()">Rattraper</button>
      </div>`;
  } else if(isAdmin()){
    buttonsHTML = `
      <div class="btn-row">
        <button class="validate" onclick="validateAccessoireAdmin()">Valider</button>
        <button class="cancel" onclick="cancelAccessoireAdmin()">Annuler</button>
        <button class="catchup" onclick="catchUpAccessoireAdmin()">Rattraper</button>
      </div>`;
  } else if(isStore()){
    const cancelOk = !!(cancelTimers["__accessoire__"] && Date.now() < cancelTimers["__accessoire__"]);
    buttonsHTML = `
      <button class="validate" onclick="validateAccessoire()">Valider une vente</button>
      <button class="cancel" ${!cancelOk ? "disabled" : ""} onclick="cancelAccessoire()">Annuler</button>`;
  }

  /* Objectif restant */
  const objRestant = objective > 0
    ? (weeklyTotal <= objective
      ? `Objectif restant : <strong>${fmt(objective - weeklyTotal)}</strong>`
      : `Objectif dépassé de : <strong>${fmt(weeklyTotal - objective)}</strong>`)
    : "";

  /* Barre */
  const barreHTML = objective > 0 ? `
    <div class="progress-container">
      <div class="progress-bar" style="width:${percentBar}%"></div>
      <div class="progress-text" style="color:${percentColor}">${percentText.toFixed(0)}%</div>
    </div>` : "";

  const tile = document.createElement("div");
  tile.id = "accessoireTile";
  tile.className = "item" + (glowClass ? " " + glowClass : "");
  tile.style.background = bgColor;

  tile.innerHTML = `
    <h3>Accessoire</h3>
    ${objRestant ? `<p>${objRestant}</p>` : ""}
    ${isManager() ? `
      <div class="personal-line">Secteur semaine : <strong>${fmt(weeklyTotal)}</strong></div>
      <div class="personal-line">Secteur aujourd'hui : <strong>${fmt(todayTotal)}</strong></div>
      ${barreHTML}
      <div class="personal-line">Boutique semaine : <strong>${fmt(boutiqueWeeklyTotal)}</strong></div>
      <div class="personal-line">Boutique aujourd'hui : <strong>${fmt(boutiqueTodayTotal)}</strong></div>
    ` : isRRStoreAcc ? `
      <div class="personal-line">Secteur semaine : <strong>${fmt(weeklyTotal)}</strong></div>
      <div class="personal-line">Secteur aujourd'hui : <strong>${fmt(todayTotal)}</strong></div>
      ${barreHTML}
      <div class="personal-line">Boutique semaine : <strong>${fmt(globalData.accessoireWeekly?.[currentUser]||0)}</strong></div>
      <div class="personal-line">Boutique aujourd'hui : <strong>${fmt(globalData.accessoirePersonal?.[currentUser]||0)}</strong></div>
    ` : isAdmin() ? `
      <div class="personal-line">Secteur semaine : <strong>${fmt(weeklyTotal)}</strong></div>
      <div class="personal-line">Secteur aujourd'hui : <strong>${fmt(todayTotal)}</strong></div>
      ${barreHTML}
    ` : `
      <div class="personal-line">Semaine : <strong>${fmt(weeklyTotal)}</strong></div>
      <div class="personal-line">Aujourd'hui : <strong>${fmt(todayTotal)}</strong></div>
      ${barreHTML}
    `}
    ${detailHTML}
    ${buttonsHTML}
  `;
  container.appendChild(tile);
}

function showAmountModal(title, label, callback){
  const modal = document.createElement("div");
  modal.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;justify-content:center;align-items:center;";
  modal.innerHTML = `
    <div style="background:#1c1c1c;border-radius:16px;padding:24px;min-width:260px;max-width:320px;width:90%;">
      <div style="font-weight:700;font-size:15px;color:#ff7a00;margin-bottom:14px;">${title}</div>
      <label style="font-size:13px;color:white;">${label}</label>
      <input type="number" class="amount-modal-input" value="0" step="0.01" min="0"
        style="width:100%;margin-top:8px;padding:8px;border-radius:8px;border:none;text-align:center;font-size:16px;">
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="amount-modal-ok" style="flex:1;background:#ff7a00;color:white;border:none;border-radius:8px;padding:10px;font-weight:700;cursor:pointer;">Valider</button>
        <button class="amount-modal-cancel" style="flex:1;background:#333;color:white;border:none;border-radius:8px;padding:10px;font-weight:700;cursor:pointer;">Annuler</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector(".amount-modal-cancel").onclick = () => modal.remove();
  modal.querySelector(".amount-modal-ok").onclick = () => {
    const montant = parseFloat(modal.querySelector(".amount-modal-input").value.replace(",","."));
    modal.remove();
    if(isNaN(montant) || montant <= 0){ alert("Montant invalide."); return; }
    callback(montant);
  };
}

window.validateAccessoire = async function(){
  const store = isManager() ? currentStore : currentUser;

  if(isStore()){
    cancelTimers["__accessoire__"] = Date.now() + 20000;
    if(cancelTimerTimeouts["__accessoire__"]) clearTimeout(cancelTimerTimeouts["__accessoire__"]);
    cancelTimerTimeouts["__accessoire__"] = setTimeout(() => {
      cancelTimers["__accessoire__"] = null;
      renderAccessoireTile();
    }, 20000);
  }

  showAmountModal("Valider accessoire", "Montant TTC de la vente (€) :", async (montant) => {
    await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(ref);
      if(!snap.exists()) return;
      const data = snap.data();
      const cAP = data.accessoirePersonal || {};
      const cAW = data.accessoireWeekly   || {};
      transaction.set(ref, {
        accessoirePersonal: { ...cAP, [store]: (cAP[store]||0) + montant },
        accessoireWeekly:   { ...cAW, [store]: (cAW[store]||0) + montant }
      }, { merge:true });
    });
  });
};

window.cancelAccessoire = async function(){
  const store = isManager() ? currentStore : currentUser;
  if(isStore() && (!cancelTimers["__accessoire__"] || Date.now() > cancelTimers["__accessoire__"])) return;
  showAmountModal("Annuler accessoire", "Montant TTC à annuler (€) :", async (montant) => {
    await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(ref);
      if(!snap.exists()) return;
      const data = snap.data();
      const cAP = data.accessoirePersonal || {};
      const cAW = data.accessoireWeekly   || {};
      transaction.set(ref, {
        accessoirePersonal: { ...cAP, [store]: Math.max((cAP[store]||0) - montant, 0) },
        accessoireWeekly:   { ...cAW, [store]: Math.max((cAW[store]||0) - montant, 0) }
      }, { merge:true });
    });
  });
};

/* =====================================================================
   CODE CERCLE — RENDU ET ACTIONS
   ===================================================================== */
function renderCercle(){
  const panelId   = isDirector() ? "directorCerclePanel"   : "cerclePanel";
  const contentId = isDirector() ? "directorCercleContent" : "cercleContent";
  const debugId   = isDirector() ? "directorCercleDebug"   : "cercleDebug";

  const panel   = document.getElementById(panelId);
  const content = document.getElementById(contentId);
  if(!panel || !content) return;

  /* Boutiques à afficher selon le profil */
  let stores = [];
  if(isManager())  stores = [currentStore];
  else if(isStore()) stores = [currentUser];
  else if(isAdmin()) stores = getCurrentSectorStores();
  else if(isDirector()) stores = allStoreUsers;

  /* Vérifier si au moins un stock a été initialisé */
  const hasAnyStock = stores.some(store =>
    cercleTypes.some(t => {
      const s = globalData.cercleStock?.[store]?.[t];
      return s && (s.initial ?? 0) !== 0;
    })
  );

  if(!hasAnyStock){ panel.classList.add("hidden"); return; }
  panel.classList.remove("hidden");

  /* Pour store et manager : afficher uniquement leur boutique */
  const targetStore = (isStore() || isManager()) ? (currentStore || currentUser) : null;

  content.innerHTML = cercleTypes.map(type => {
    /* Agréger les données selon le profil */
    let initial = 0, restant = 0;
    if(targetStore){
      initial = globalData.cercleStock?.[targetStore]?.[type]?.initial ?? 0;
      restant = globalData.cercleStock?.[targetStore]?.[type]?.restant ?? 0;
    } else {
      stores.forEach(s => {
        initial += globalData.cercleStock?.[s]?.[type]?.initial ?? 0;
        restant += globalData.cercleStock?.[s]?.[type]?.restant ?? 0;
      });
    }

    if(initial === 0 && restant === 0) return ""; /* rien saisi */

    const ratio = initial > 0 ? restant / initial : 0;
    let bgColor = "#66cc88"; /* vert */
    if(restant <= 0) bgColor = "#cc3333"; /* rouge si 0 ou négatif */
    else if(ratio <= CERCLE_SEUIL_ORANGE) bgColor = "#ff7a00"; /* orange */

    const canUse = isStore() || isManager();

    /* Détail par boutique pour admin/director */
    let detailHTML = "";
    if(!targetStore){
      detailHTML = stores.map(s => {
        const r = globalData.cercleStock?.[s]?.[type]?.restant ?? 0;
        const i = globalData.cercleStock?.[s]?.[type]?.initial ?? 0;
        if(i === 0 && r === 0) return "";
        return `<div style="font-size:11px;margin-top:2px;">${s} : ${i > 0 ? `${r}/${i}` : `${r}`}</div>`;
      }).join("");
    }

    return `
      <div class="item" style="background:${bgColor};min-width:160px;flex:1;max-width:220px;">
        <div style="font-weight:700;font-size:14px;margin-bottom:6px;">${type}</div>
        <div style="font-size:22px;font-weight:900;">${restant}${initial > 0 ? `<span style="font-size:13px;font-weight:400;opacity:0.8;"> / ${initial}</span>` : ""}</div>
        ${detailHTML}
        ${canUse ? `<button class="validate" onclick="utiliserCercle('${type}')" style="margin-top:8px;width:100%;font-size:12px;padding:6px;">Utiliser un code</button>` : ""}
      </div>`;
  }).join("");
}

window.utiliserCercle = async function(type){
  if(!isStore() && !isManager()) return;
  const store = isManager() ? currentStore : currentUser;
  const stock = globalData.cercleStock?.[store]?.[type] || { initial:0, restant:0 };
  if(stock.restant <= 0){ alert("Plus de codes disponibles pour " + type); return; }
  if(!confirm(`Utiliser un code ${type} ?`)) return;

  await runTransaction(db, async (transaction) => {
    const snap = await transaction.get(ref);
    if(!snap.exists()) return;
    const data = snap.data();
    const cCS = structuredClone(data.cercleStock || {});
    if(!cCS[store]) cCS[store] = {};
    if(!cCS[store][type]) cCS[store][type] = { initial:0, restant:0 };
    cCS[store][type].restant = Math.max(cCS[store][type].restant - 1, 0);
    transaction.set(ref, { cercleStock: cCS }, { merge:true });
  });
};

window.saveCercleStock = async function(){
  if(!isManager()) return;
  if(!confirm("Valider le stock Code Cercle ?")) return;
  const cCS = structuredClone(globalData.cercleStock || {});
  if(!cCS[currentStore]) cCS[currentStore] = {};
  cercleTypes.forEach(t => {
    const key = t.replace(/ /g, '_');
    const input = document.getElementById("cercle-" + key);
    if(!input) return;
    const val = parseInt(input.value);
    if(isNaN(val)) return;
    const existing = cCS[currentStore][t] || { initial:0, restant:0 };
    const diff = val - (existing.initial || 0);
    cCS[currentStore][t] = {
      initial: val,
      restant: (existing.restant || 0) + diff
    };
  });
  await setDoc(ref, { cercleStock: cCS }, { merge:true });
};

window.resetCercleStock = async function(){
  if(!isManager()) return;
  if(!confirm("Réinitialiser le stock Code Cercle ?")) return;
  const cCS = structuredClone(globalData.cercleStock || {});
  if(!cCS[currentStore]) cCS[currentStore] = {};
  cercleTypes.forEach(t => { cCS[currentStore][t] = { initial:0, restant:0 }; });
  await setDoc(ref, { cercleStock: cCS }, { merge:true });
};

      </div>`;

    /* 3. Boutons KPI — gérés par le HTML via saveObjectives/resetWeekly */

        + '<input type="number" id="cercle-' + key + '" value="' + stock.initial + '" style="width:70px;"> '
        + '<span style="opacity:0.7;font-size:12px;"> restant : ' + stock.restant + '</span></div>';
    }).join("");

    div.innerHTML += `
      <div style="margin-top:16px;padding-top:12px;border-top:2px solid #3a9ad9;">

/* =====================================================================
   SAVE OBJECTIVES
   ===================================================================== */
window.saveObjectives = async function(){
  if(!confirm("Valider les nouveaux objectifs ?")) return;

  if(isAdmin()){
    const currentSectorInitial = globalData.sectorInitial || {};
    const updatedSectorInitial = { ...(currentSectorInitial[currentSector] || {}) };
    const cAO = globalData.accessoireObjective || { sector:{}, store:{} };
    const accVal = parseFloat(document.getElementById("obj-accessoire-sector")?.value) || 0;

    boutiqueDisplayList.forEach(item => {
      const val = parseInt(document.getElementById("obj-" + item).value) || 0;
      updatedSectorInitial[item] = val;
    });

    await setDoc(ref, {
      sectorInitial: { ...currentSectorInitial, [currentSector]: updatedSectorInitial },
      accessoireObjective: { ...cAO, sector: { ...(cAO.sector||{}), [currentSector]: accVal } }
    }, { merge:true });
    return;
  }

  if(isManager()){
    const cBO = globalData.boutiqueObjectives || {};
    const cBI = globalData.boutiqueInitial    || {};
    const cBP = globalData.boutiqueProgress   || {};
    const cAO = globalData.accessoireObjective || { sector:{}, store:{} };
    const accVal = parseFloat(document.getElementById("obj-accessoire-store")?.value) || 0;

    const updatedObj  = { ...(cBO[currentStore] || {}) };
    const updatedInit = { ...(cBI[currentStore] || {}) };
    const resetProg   = { ...(cBP[currentStore] || {}) };

    boutiqueDisplayList.forEach(item => {
      const val = parseInt(document.getElementById("obj-" + item).value) || 0;
      updatedObj[item]  = val;
      updatedInit[item] = val;
      resetProg[item]   = 0;
    });

    await setDoc(ref, {
      boutiqueObjectives:  { ...cBO, [currentStore]: updatedObj },
      boutiqueInitial:     { ...cBI, [currentStore]: updatedInit },
      boutiqueProgress:    { ...cBP, [currentStore]: resetProg },
      accessoireObjective: { ...cAO, store: { ...(cAO.store||{}), [currentStore]: accVal } }
    }, { merge:true });
  }
};

/* =====================================================================
   RESET WEEKLY
   ===================================================================== */
window.resetWeekly = async function(){
  if(!confirm("Réinitialiser tous les objectifs ?")) return;

  if(isAdmin()){
    await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(ref);
      if(!snap.exists()) return;
      const data = snap.data();

      const cST  = data.sectorTotals        || {};
      const cWST = data.weeklySectorTotals   || {};
      const cSI  = data.sectorInitial        || {};

      const newST  = { ...cST,  [currentSector]: {} };
      const newWST = { ...cWST, [currentSector]: {} };
      const newSI  = { ...cSI,  [currentSector]: {} };

      itemsList.forEach(item => {
        newST[currentSector][item]  = 0;
        newWST[currentSector][item] = 0;
        newSI[currentSector][item]  = 0;
      });

      /* Reset weeklyPersonal pour les boutiques du secteur */
      const cWP = data.weeklyPersonal || {};
      const newWP = { ...cWP };
      sectors[currentSector].stores.forEach(store => {
        newWP[store] = {};
        itemsList.forEach(item => newWP[store][item] = 0);
      });

      transaction.set(ref, {
        sectorTotals:       newST,
        weeklySectorTotals: newWST,
        sectorInitial:      newSI,
        weeklyPersonal:     newWP
      }, { merge:true });
    });
    return;
  }

  if(isManager()){
    await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(ref);
      if(!snap.exists()) return;
      const data = snap.data();

      const cBO = data.boutiqueObjectives || {};
      const cBI = data.boutiqueInitial    || {};
      const cBP = data.boutiqueProgress   || {};

      const resetObj  = { ...(cBO[currentStore] || {}) };
      const resetInit = { ...(cBI[currentStore] || {}) };
      const resetProg = { ...(cBP[currentStore] || {}) };

      boutiqueDisplayList.forEach(item => {
        resetObj[item]  = 0;
        resetInit[item] = 0;
        resetProg[item] = 0;
      });

      transaction.set(ref, {
        boutiqueObjectives: { ...cBO, [currentStore]: resetObj },
        boutiqueInitial:    { ...cBI, [currentStore]: resetInit },
        boutiqueProgress:   { ...cBP, [currentStore]: resetProg }
      }, { merge:true });
    });
  }
};
